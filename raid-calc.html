<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raid_calc</title>
<style>
  :root{
    --bg:#14161a; --panel:#1d2026; --panel2:#232730; --line:#2e333d;
    --text:#d7dae0; --muted:#8b909a; --accent:#4f8cff; --accent2:#7ee2a8;
    --warn:#e8b45a; --bad:#e57373; --link:#4a5160;
    --line-hover:#3c4350; --root-line:#2f4a3c;
    --grid-dot:#20242c; --hud-bg:rgba(20,22,26,.8); --pop-bg:rgba(20,22,26,.95);
    --scrim:rgba(10,12,16,.6); --mm-node:#3a4150;
    --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.55);
  }
  [data-theme="light"]{
    --bg:#eef1f5; --panel:#ffffff; --panel2:#f7f9fb; --line:#dde2ea;
    --text:#1b2027; --muted:#5b6673; --accent:#2f6fe4; --accent2:#12915c;
    --warn:#a9700f; --bad:#c0392b; --link:#b6bec9;
    --line-hover:#c3cbd8; --root-line:#7fbf9c;
    --grid-dot:#d3d9e2; --hud-bg:rgba(255,255,255,.85); --pop-bg:rgba(255,255,255,.97);
    --scrim:rgba(30,36,45,.45); --mm-node:#c2cad6;
    --shadow:0 6px 18px rgba(24,32,44,.13); --shadow-lg:0 14px 34px rgba(24,32,44,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; overflow:hidden;}
  #app{display:grid; grid-template-rows:46px 1fr; grid-template-columns:230px 1fr 300px; height:100vh;}
  header{grid-column:1/4; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line);}
  header h1{font-size:14px; font-weight:600; margin-right:8px; white-space:nowrap;}
  .spacer{flex:1;}
  button{background:var(--accent); border:0; color:#fff; border-radius:7px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;}
  button.ghost{background:var(--panel2); border:1px solid var(--line); color:var(--text); font-weight:500;}
  button.ghost:hover{border-color:var(--accent);}
  button.magic{background:linear-gradient(100deg,#7b5cff,#4f8cff);}
  button.tiny{padding:2px 7px; font-size:11px;}
  button.danger{color:var(--bad);}
  button.disabled{opacity:.4; pointer-events:none;}
  button.chip-btn{background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-weight:500; font-size:12px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  button.chip-btn:hover{border-color:var(--accent); color:var(--text);}

  .side{background:var(--panel); border-right:1px solid var(--line); padding:12px; overflow:auto;}
  .side h3{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 0 8px;}
  .side h3:first-child{margin-top:0;}
  .side-foot{color:var(--muted); font-size:11px; margin-top:16px; border-top:1px solid var(--line); padding-top:10px;}
  .pal{display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:grab; font-size:12.5px; -webkit-user-drag:none;}
  .pal:hover{border-color:var(--accent);}
  .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .inv,.inventory{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:6px; font-size:12px;}
  .inventory .row{display:flex; justify-content:space-between; align-items:center; padding:2px 0;}
  .inventory .row b{color:var(--accent2); font-weight:600;}
  .num{color:var(--accent2); font-weight:600;}
  .sub{color:var(--muted); font-size:11px;}

  /* sidebar disk library */
  .library{display:flex; flex-direction:column; gap:6px;}
  .lib-row{display:grid; grid-template-columns:10px 1fr; grid-template-rows:auto auto; gap:2px 8px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    cursor:grab; font-size:12px; touch-action:none;}
  .lib-row:hover{border-color:var(--warn);}
  .side{-webkit-user-select:none; user-select:none;}
  .lib-row.sel{border-color:var(--warn); box-shadow:0 0 0 1px var(--warn);}
  .lib-row .dot{grid-row:1/3; align-self:center;}
  .lib-name{display:flex; justify-content:space-between; gap:6px; font-weight:600;}
  .lib-cap{color:var(--muted); font-weight:500;}
  .lib-meta{color:var(--muted); font-size:11px;}
  .lib-ghost{position:fixed; z-index:80; pointer-events:none; background:var(--panel2);
    border:1px dashed var(--warn); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--warn);}

  /* canvas viewport */
  .canvas{position:relative; overflow:hidden; background:radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0/22px 22px, var(--bg);
    -webkit-user-select:none; user-select:none; cursor:grab;}
  .canvas.space-pan{cursor:grab;}
  .canvas text{-webkit-user-select:none; user-select:none;}
  .canvas.panning{cursor:grabbing;}
  .world{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;}
  .wires{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
  .wire{fill:none; stroke:var(--link); stroke-width:2; pointer-events:none;}
  .wire.sel{stroke:var(--accent); stroke-width:2.5;}
  .wire-hit{fill:none; stroke:transparent; stroke-width:18; pointer-events:stroke; cursor:pointer;}
  .link-ghost{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:5 4; pointer-events:none;}
  .cut-btn{pointer-events:all; cursor:pointer;}
  .cut-btn circle{fill:var(--panel); stroke:var(--bad); stroke-width:1.5;}
  .cut-btn text{fill:var(--bad); font-size:11px; font-family:inherit;}

  .node{position:absolute; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); font-size:12px; cursor:grab; touch-action:none;}
  .node input.inline{-webkit-user-select:text; user-select:text; cursor:text;}
  .node:hover{border-color:var(--line-hover);}
  .node.sel{border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent), var(--shadow);}
  .node.root{border-color:var(--root-line);}
  .node.dragging{pointer-events:none; opacity:.9; cursor:grabbing; box-shadow:var(--shadow-lg);}
  .node.drop-ok{border-color:var(--accent2); box-shadow:0 0 0 2px var(--accent2);}
  .node.drop-bad{border-color:var(--bad); box-shadow:0 0 0 2px rgba(229,115,115,.7);}
  .node .hd{display:flex; align-items:center; gap:7px; padding:7px 11px; border-bottom:1px solid var(--line); font-weight:600; white-space:nowrap; overflow:hidden;}
  .node .hd .chev{cursor:pointer; color:var(--muted); width:12px; text-align:center; flex:none;}
  .node .hd .chev:hover{color:var(--text);}
  .node .hd .badge{margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.04em; border-radius:5px; padding:2px 6px; background:rgba(79,140,255,.15); color:var(--accent); flex:none;}
  .node.root .hd .badge{background:rgba(126,226,168,.15); color:var(--accent2);}
  .node .bd{padding:7px 11px 9px; color:var(--muted);}
  .node .kv{display:flex; justify-content:space-between; gap:8px; padding:1.5px 0;}
  .node .kv b{color:var(--text); font-weight:500; text-align:right;}
  .node .kv[data-editable]:hover b{color:var(--accent); text-decoration:underline dotted;}
  .node .kv input.inline{width:92px; background:var(--bg); border:1px solid var(--accent); color:var(--text); border-radius:4px; padding:0 4px; font:inherit; text-align:right;}
  .node .port{position:absolute; width:14px; height:14px; border-radius:50%; background:var(--bg);
    border:2px solid var(--accent); z-index:5; cursor:crosshair;}
  .node .port::before{content:""; position:absolute; inset:-9px; border-radius:50%;}
  .node .port.in{bottom:-8px; left:calc(50% - 7px); border-color:var(--accent);}
  .node .port.out{top:-8px; left:calc(50% - 7px); border-color:var(--accent2);}
  .node .port:hover{border-color:var(--accent2); transform:scale(1.15);}

  /* root result ribbon — the single home for top-level results */
  .ribbon{margin:8px 10px 0; padding:8px; border:1px solid var(--line); border-radius:8px;
    background:rgba(126,226,168,.05); cursor:pointer;}
  .ribbon:hover{border-color:var(--accent2);}
  .ribbon.muted{color:var(--muted); text-align:center; padding:12px 8px; font-size:11.5px;}
  .rb-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 8px;}
  .rb-cell{display:flex; flex-direction:column;}
  .rb-v{font-size:13px; font-weight:700; color:var(--text);}
  .rb-k{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  .ribbon .spark{display:block; margin-top:6px;}
  .rb-stale{margin-top:5px; font-size:10px; color:var(--warn);}

  /* member chips */
  .chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
  .chip{display:inline-flex; align-items:center; gap:3px; background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:2px 5px; font-size:11px; color:var(--muted); max-width:100%;}
  .chip.kind{border-color:rgba(232,180,90,.35);}
  .chip.pool{border-color:rgba(79,140,255,.35);}
  .chip b{color:var(--text);}
  .chip i{font-style:normal;}
  .chip .chip-link{display:inline-flex; gap:3px; cursor:pointer;}
  .chip .x{background:transparent; border:0; color:var(--muted); cursor:pointer; font-size:11px; padding:0 3px; opacity:0;}
  .chip .x:focus-visible,.chip:hover .x{opacity:1;}
  .chip .x:hover{color:var(--accent2);}
  .chip .x.rm:hover{color:var(--bad);}
  .chip.add{cursor:pointer; border-style:dashed;}
  .chip.add:hover{border-color:var(--accent); color:var(--accent);}
  .preview-pop{position:absolute; z-index:4; pointer-events:none; background:var(--pop-bg);
    border:1px dashed var(--line); border-radius:8px; padding:7px 9px;}
  .np-row{display:flex; justify-content:space-between; gap:8px; font-size:11px;}
  .np-row b{color:var(--accent2);}
  .np-err{font-size:11px; color:var(--warn);}

  /* canvas hud */
  .hud{position:absolute; left:10px; bottom:10px; display:flex; align-items:center; gap:8px; z-index:10;}
  .hud-hint{font-size:11px; color:var(--muted); background:var(--hud-bg); padding:3px 8px; border-radius:6px;}
  .zoom-label{font-size:11px; color:var(--muted); min-width:34px;}
  .minimap{background:var(--hud-bg); border:1px solid var(--line); border-radius:8px;
    position:absolute; right:10px; bottom:10px; cursor:pointer;}
  .mm-node{fill:var(--mm-node);}
  .mm-sel{fill:var(--accent);}
  .mm-view{fill:rgba(126,226,168,.12); stroke:var(--accent2); stroke-width:1;}

  /* drag delta chip */
  .drag-chip{position:absolute; z-index:60; pointer-events:none; background:var(--pop-bg);
    border:1px solid var(--accent); border-radius:8px; padding:7px 9px; font-size:11.5px; box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .dc-row{display:flex; gap:6px; align-items:baseline; white-space:nowrap;}
  .dc-row span{color:var(--muted);}
  .dc-note{color:var(--muted); font-size:11px;}
  .node-curve{margin-top:6px;}
  .node-curve svg{display:block;}
  select.mini-select{background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:5px 6px; font-size:12px; cursor:pointer;}
  .dc-v.good{color:var(--accent2);}
  .dc-v.bad{color:var(--bad);}

  /* properties panel */
  .props{background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow:auto;}
  .props h3{font-size:12.5px; margin-bottom:2px;}
  .props .crumb{font-size:11px; color:var(--muted); margin-bottom:10px;}
  .props h4{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:14px 0 8px;}
  .props p, .props .hint{font-size:11.5px; color:var(--muted); margin-top:10px;}
  .field{margin-bottom:7px;}
  .field label{display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
  .field input,.field select{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px;}
  .field input.invalid{border-color:var(--bad);}
  .form-error{background:rgba(229,115,115,.1); border:1px solid rgba(229,115,115,.4); color:var(--bad); border-radius:8px; padding:7px 9px; font-size:11.5px; margin-bottom:9px;}
  .note{background:rgba(232,180,90,.08); border:1px solid rgba(232,180,90,.3); color:var(--warn); border-radius:8px; padding:8px 10px; font-size:11.5px; margin-top:12px;}
  .members-list .member-row{display:flex; align-items:center; gap:5px; padding:3px 0; font-size:12px;}
  .members-list .member-row span{flex:1;}
  .keylist{display:flex; flex-direction:column; gap:5px;}
  .keyrow{display:grid; grid-template-columns:132px 1fr; gap:8px; font-size:11.5px; color:var(--muted); align-items:baseline;}
  .keyrow span{color:var(--text);}
  kbd{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); border:1px solid var(--line);
    border-radius:5px; padding:1px 5px; color:var(--muted); text-align:center;}

  /* results drawer */
  .drawer{position:fixed; left:230px; right:300px; bottom:0; z-index:30; background:var(--panel);
    border-top:1px solid var(--line); box-shadow:0 -14px 40px rgba(0,0,0,.45); padding:12px 14px 14px; max-height:60vh; overflow:auto;}
  .drawer-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .drawer-head h2{font-size:13px;}
  .drawer-grid{display:grid; grid-template-columns:1fr 1fr 200px; gap:14px; align-items:start;}
  .drawer-chart .dc-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px;}
  .drawer-metrics .row{display:flex; justify-content:space-between; font-size:11.5px; padding:2px 0;}
  .drawer-metrics .row span{color:var(--muted);}
  .drawer-metrics .row b{color:var(--accent2);}

  /* modal + palette + menus */
  .modal{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; z-index:50;}
  .modal .card{width:620px; max-height:80vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal .card.narrow{width:460px;}
  .modal h2{font-size:14px; margin-bottom:12px;}
  .dialog-body{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .modal .foot{display:flex; gap:8px; justify-content:flex-end; margin-top:14px;}
  .palette-modal{align-items:flex-start; padding-top:12vh;}
  .palette-card{width:520px; padding:10px !important;}
  .palette-input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 11px; font-size:13px; margin-bottom:8px;}
  .palette-list{max-height:320px; overflow:auto;}
  .palette-row{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:7px 10px;
    border-radius:7px; cursor:pointer; font-size:12.5px;}
  .palette-row.active{background:rgba(79,140,255,.14);}
  .menu{position:absolute; z-index:70; background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:5px; box-shadow:0 12px 34px rgba(0,0,0,.5); min-width:210px;}
  .menu-item{display:block; width:100%; text-align:left; background:transparent; color:var(--text);
    border:0; border-radius:6px; padding:6px 9px; font-size:12.5px; font-weight:500; cursor:pointer;}
  .menu-item:hover{background:var(--panel2);}
  .menu-item.danger{color:var(--bad);}
  .toasts{position:fixed; right:14px; bottom:14px; z-index:90; display:flex; flex-direction:column; gap:6px;}
  .toast{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--muted);
    border-radius:8px; padding:8px 11px; font-size:12px; box-shadow:0 10px 30px rgba(0,0,0,.5); max-width:420px;}
  .toast.bad{border-left-color:var(--bad);}
  .toast.ok{border-left-color:var(--accent2);}

  table{width:100%; border-collapse:collapse; font-size:12px;}
  th{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; text-align:left; padding:5px 6px; border-bottom:1px solid var(--line);}
  td{padding:6px 6px; border-bottom:1px solid var(--line);}
  tr.win{background:rgba(126,226,168,.06);}
  .why{color:var(--muted); font-size:11px;}
</style>
</head>

function openPalette({ host, commands, onClose, t = (x) => x }) {
  const overlay = document.createElement("div");
  overlay.className = "modal palette-modal";
  overlay.innerHTML = `<div class="card palette-card"><input class="palette-input" placeholder="${t("Type a command\u2026")}" /><div class="palette-list"></div></div>`;
  host.appendChild(overlay);
  const input = overlay.querySelector(".palette-input");
  const list = overlay.querySelector(".palette-list");
  let active = 0;
  let filtered = commands.slice();
  const render = () => {
    list.innerHTML = "";
    filtered.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "palette-row" + (i === active ? " active" : "");
      const label = document.createElement("span");
      label.textContent = c.label;
      row.appendChild(label);
      if (c.hint) {
        const hint = document.createElement("kbd");
        hint.textContent = c.hint;
        row.appendChild(hint);
      }
      row.addEventListener("mouseenter", () => {
        active = i;
        render();
      });
      row.addEventListener("click", () => pick(i));
      list.appendChild(row);
    });
    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "palette-row";
      empty.textContent = t("no matching command");
      list.appendChild(empty);
    }
  };
  const close = () => {
    overlay.remove();
    if (onClose) onClose();
  };
  const pick = (i) => {
    const cmd = filtered[i];
    close();
    if (cmd && cmd.run) cmd.run();
  };
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    filtered = commands.filter((c) => fuzzyMatch(c.label + " " + (c.keywords || ""), q));
    active = 0;
    render();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.stopPropagation();
      close();
    } else if (e.key === "ArrowDown") {
      active = Math.min(active + 1, filtered.length - 1);
      render();
      e.preventDefault();
    } else if (e.key === "ArrowUp") {
      active = Math.max(active - 1, 0);
      render();
      e.preventDefault();
    } else if (e.key === "Enter") {
      pick(active);
      e.preventDefault();
    }
  });
  overlay.addEventListener("mousedown", (e) => {
    if (e.target === overlay) close();
  });
  render();
  input.focus();
  return close;
}
function fuzzyMatch(text, query) {
  if (!query) return true;
  const t = text.toLowerCase();
  const q = query.toLowerCase();

    if (ch === q[i]) i++;

  }

}

          const result = designSummary(d.config);
          if (!result) return;
          overlays.push({
            label: `opt #${i + 1}`,
            result,
            color: PALETTE_COLORS[(overlays.length + 1) % PALETTE_COLORS.length]
          });
          show.textContent = t("Show curves") + " \u2713";
          drawerOpen = true;
          renderDrawer();
        });
        const apply = el3("button", t("Apply"));
        apply.className = "ghost tiny";
        apply.addEventListener("click", () => {
          if (d.config && d.config.tree) {
            commit((c) => ({ ...c, tree: structuredClone(d.config.tree) }), "apply design");
            close();
            renderAll();
          }
        });
        actions.appendChild(show);
        actions.appendChild(apply);
        tr.appendChild(actions);
        table.appendChild(tr);
      });
      body.appendChild(table);
      const foot = el3("div");
      foot.className = "foot";
      const closeBtn = btn(t("Close"), "ghost");
      closeBtn.addEventListener("click", close);
      foot.appendChild(closeBtn);
    } catch (e) {
      const n = el3("div", `optimize() failed: ${e.message || e}`);
      n.className = "note";
      n.dataset.stack = String(e && e.stack || "");
      body.textContent = "";
      body.appendChild(n);
      console.error("[optimizer modal]", e);
    }
  }
  commitUi((ui) => ({ ...ui, lang, theme }), { recordHistory: false, render: false });
  renderChrome();
  renderAll();
  scenarioChip.textContent = scenarioLabel(store.get());
  store.subscribe(() => {
    scenarioChip.textContent = scenarioLabel(store.get());
  });
  return { store, run, getState: () => store.get(), renderAll };
}
function el3(tag, text) {

  return n;
}
function btn(text, cls) {

  b.textContent = text;
  if (cls) b.className = cls;
  return b;
}
function palItem(text, color) {

  d.className = "pal";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.style.background = color;
  d.appendChild(dot);
  d.appendChild(el3("span", text));
  return d;
}
function designLabel(d) {
  if (d && d.tree) {
    const s = d.tree.strategy || "";

  }

}
if (typeof document !== "undefined" && document.getElementById("app")) {
  const root = document.getElementById("app");
  root.__app = createApp(root);
}
export {
  createApp
};
